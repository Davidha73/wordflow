[package]
name = "wordflow"
version = "0.2.0"
description = "WordFlow - Standalone Desktop Word Processor"
authors = ["WordFlow"]
edition = "2021"

[lib]
name = "wordflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-kit = "0.14.3"
harper-core = "0.24"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSObjCRuntime", "NSRange", "NSString"] }
